<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic Intersection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>

    <div id="canvas-container">
      <div id="canvas-viewport" class="canvas-viewport">
        <canvas id="bg" aria-hidden="true"></canvas>
        <canvas id="fg"></canvas>
        <canvas id="signals" aria-hidden="true"></canvas>
      </div>

      <!-- Floating crosswalk controls (draggable over the canvas) -->
      <div
        id="crosswalk-panel"
        class="floating-panel panel crosswalk-float"
        aria-label="Crosswalk controls"
      >
        <div class="floating-panel__drag" id="crosswalk-drag-handle" title="Drag to move">
          <span class="floating-panel__drag-grip" aria-hidden="true"></span>
          <span class="floating-panel__drag-label">Crosswalk</span>
        </div>
        <div class="ped-panel ped-panel--floating">
          <div class="ped-panel__head ped-panel__head--floating">
            <span class="label ped-panel__signal-label">Signal</span>
            <span class="phase-pill ped-panel__phase">
              <span class="phase-dot" id="ped-dot" aria-hidden="true"></span>
              <span id="ped-phase">Ready</span>
            </span>
          </div>
          <div class="ped-compass" role="group" aria-label="Crosswalk requests">
            <div class="ped-compass__grid">
                  <div class="ped-btn-cell ped-compass__slot ped-compass__slot--n">
                    <button
                      type="button"
                      class="ped-btn ped-btn--default"
                      data-ped-approach="N"
                      aria-label="Request crossing walking toward East, north leg"
                    >
                      <span class="ped-btn__dir" aria-hidden="true">East</span>
                    </button>
                <span class="ped-btn__status" aria-live="polite"></span>
              </div>
                  <div class="ped-btn-cell ped-compass__slot ped-compass__slot--w">
                    <button
                      type="button"
                      class="ped-btn ped-btn--default"
                      data-ped-approach="W"
                      aria-label="Request crossing walking toward North, west leg"
                    >
                      <span class="ped-btn__dir" aria-hidden="true">North</span>
                    </button>
                <span class="ped-btn__status" aria-live="polite"></span>
              </div>
              <div class="ped-compass__hub" aria-hidden="true">
                <span class="ped-compass__hub-mark">✚</span>
              </div>
                  <div class="ped-btn-cell ped-compass__slot ped-compass__slot--e">
                    <button
                      type="button"
                      class="ped-btn ped-btn--default"
                      data-ped-approach="E"
                      aria-label="Request crossing walking toward South, east leg"
                    >
                      <span class="ped-btn__dir" aria-hidden="true">South</span>
                    </button>
                <span class="ped-btn__status" aria-live="polite"></span>
              </div>
                  <div class="ped-btn-cell ped-compass__slot ped-compass__slot--s">
                    <button
                      type="button"
                      class="ped-btn ped-btn--default"
                      data-ped-approach="S"
                      aria-label="Request crossing walking toward West, south leg"
                    >
                      <span class="ped-btn__dir" aria-hidden="true">West</span>
                    </button>
                <span class="ped-btn__status" aria-live="polite"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <aside class="sim-ui" aria-label="Simulation interface">
      <!-- Header: title + active phase -->
      <div class="corner tl panel header" id="hdr">
        <div class="logo-dot" aria-hidden="true">IX</div>
        <div class="title-block">
          <div class="eyebrow">Junction Simulator</div>
          <div class="name">Four-Way Intersection</div>
        </div>
        <div class="phase-rows">
          <div class="phase-row">
            <div class="meta">
              <span class="label">Active Phase</span>
              <span class="phase-pill">
                <span class="phase-dot" id="curr-dot" aria-hidden="true"></span>
                <span id="curr-name">—</span>
              </span>
            </div>
            <div class="meta">
              <span class="label">Time in phase</span>
              <span class="value" id="curr-time">00.0s</span>
            </div>
          </div>
          <div class="phase-row phase-row--next">
            <div class="meta">
              <span class="label">Next Phase</span>
              <span class="phase-pill">
                <span class="phase-dot" id="next-dot" aria-hidden="true"></span>
                <span id="next-name">—</span>
              </span>
            </div>
            <div class="meta">
              <span class="label" id="next-timing-label">Adaptive timing</span>
              <span class="value timing" id="next-timing">—</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Telemetry: throughput, avg wait, queue -->
      <div class="corner tr panel telemetry" id="tel">
        <div>
          <div class="label">Throughput</div>
          <div class="value">
            <span id="tput">0</span><span class="unit">veh</span>
          </div>
        </div>
        <div>
          <div class="label">Avg wait</div>
          <div class="value">
            <span id="twait">0.0</span><span class="unit">s</span>
          </div>
        </div>
        <div>
          <div class="label">In queue</div>
          <div class="value"><span id="tqueue">0</span></div>
        </div>
      </div>

    </aside>

    <div class="corner bl panel tweaks is-open" id="tweaks">
      <h3 class="tweaks-head">
        <span class="tweaks-head__title">Tweaks</span>
        <div class="tweaks-head__actions">
          <button
            type="button"
            class="closex tweaks-expand"
            id="tw-expand"
            hidden
            title="Expand tweaks"
            aria-label="Expand tweaks panel"
          >
            ▲
          </button>
          <button
            type="button"
            class="closex"
            id="tw-close"
            title="Minimize"
            aria-label="Minimize tweaks panel"
          >
            ✕
          </button>
        </div>
      </h3>
      <div class="tweaks-body">
      <div class="tw-row">
        <div class="tw-label">Theme</div>
        <div class="seg" data-tweak="theme">
          <button type="button" data-val="light">Day</button>
          <button type="button" data-val="dark">Night</button>
        </div>
      </div>
      <div class="tw-row">
        <div class="tw-label">Density</div>
        <div class="seg" data-tweak="density">
          <button type="button" data-val="low">Low</button>
          <button type="button" data-val="med">Med</button>
          <button type="button" data-val="high">High</button>
        </div>
      </div>
      <div class="tw-row">
        <div class="tw-label">Diagnostics</div>
        <div class="seg" data-tweak="diag">
          <button type="button" data-val="off">Off</button>
          <button type="button" data-val="on">On</button>
        </div>
      </div>
      <div class="tw-row">
        <div class="tw-label">Crosswalks</div>
        <div class="seg" data-tweak="crosswalks">
          <button type="button" data-val="on">Show</button>
          <button type="button" data-val="off">Hide</button>
        </div>
      </div>
      </div>
    </div>

    <div class="bottom-right-stack" aria-label="Playback and orientation">
      <div class="kbd-hint" aria-hidden="true">
        <span><b>Space</b> play / pause</span>
        <span><b>R</b> reset</span>
        <span><b>1·2·3·4</b> speed</span>
      </div>
      <div class="bottom-right-dock">
      <div class="panel transport" id="transport">
        <button
          type="button"
          class="tbtn primary"
          id="playBtn"
          title="Play / Pause (Space)"
          aria-label="Play or pause"
          aria-pressed="false"
        >
          <svg id="playIco" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M6 4l14 8-14 8V4z" />
          </svg>
        </button>
        <button
          type="button"
          class="tbtn"
          id="stepBtn"
          title="Step one frame"
          aria-label="Step one frame"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 5v14M15 12l-9 7V5l9 7z" />
          </svg>
        </button>
        <div class="divider" aria-hidden="true"></div>
        <div class="speed-group" id="spdGroup" role="group" aria-label="Simulation speed">
          <button type="button" class="speed-btn" data-spd="0.5">0.5×</button>
          <button type="button" class="speed-btn active" data-spd="1">1×</button>
          <button type="button" class="speed-btn" data-spd="2">2×</button>
          <button type="button" class="speed-btn" data-spd="4">4×</button>
        </div>
        <div class="divider" aria-hidden="true"></div>
        <button type="button" class="tbtn" id="resetBtn" title="Reset (R)" aria-label="Reset simulation">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 1 0 3-6.7" />
            <path d="M3 3v6h6" />
          </svg>
        </button>
      </div>
      <div class="compass" id="compass" aria-label="Map orientation">
        <span class="n">N</span>
        <span class="s">S</span>
        <span class="e">E</span>
        <span class="w">W</span>
        <div class="needle" id="compass-needle"></div>
      </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
