<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic Intersection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="canvas-container">
      <div id="canvas-viewport" class="canvas-viewport">
        <canvas id="bg" aria-hidden="true"></canvas>
        <canvas id="fg"></canvas>
        <canvas id="signals" aria-hidden="true"></canvas>
      </div>
    </div>
    <div class="compass" id="compass" aria-label="Map orientation">
      <span class="n">N</span>
      <span class="s">S</span>
      <span class="e">E</span>
      <span class="w">W</span>
      <div class="needle" id="compass-needle"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
